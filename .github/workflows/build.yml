name: Build GameBootloader EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Lay ma nguon
      uses: actions/checkout@v4

    - name: Cai dat Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cai dat thu vien can thiet
      run: |
        python -m pip install --upgrade pip
        pip install PyQt5 psutil pywin32 pyinstaller

    - name: Dong goi file EXE
      run: |
        pyinstaller --onefile --noconsole --collect-all PyQt5 --collect-all win32gui --name="GameBootloader" "AUTO START QT vs TINKER.py"

    - name: Luu file EXE de tai ve
      uses: actions/upload-artifact@v4
      with:
        name: GameBootloader-EXE
        path: dist/GameBootloader.exe
