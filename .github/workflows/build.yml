name: Build GameBootloader EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Libraries
      run: |
        python -m pip install --upgrade pip
        pip install PyQt5 psutil pywin32 pyinstaller

    - name: Build Standalone EXE
      shell: cmd
      run: |
        pyinstaller --noconfirm --onedir --windowed --hidden-import=win32timezone --hidden-import=win32gui --hidden-import=win32ui --hidden-import=win32con --name=GameBootloader "AUTO START QT vs TINKER.py"
        cd dist
        tar -czvf GameBootloader.zip GameBootloader

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GameBootloader-App
        path: dist/GameBootloader.zip
